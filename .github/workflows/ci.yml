name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # 1. CONTINUOUS INTEGRATION
  # =========================
  test:
    runs-on: ubuntu-latest

    # Normal environment variable.
    # This is NOT a GitHub Environment.
    env:
      APP_ENV: test

    steps:

      # Get source code onto the GitHub runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the required Python version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install CI dependencies.
      - name: Install dependencies
        run: |
          pip install pytest flake8

      # Demonstrate use of an environment variable.
      - name: Show environment
        run: echo "Environment is $APP_ENV"

      # Check Python code quality.
      - name: Lint Python code
        run: flake8 app.py test_app.py

      # Run automated tests.
      - name: Run tests
        run: pytest


  # =========================
  # 2. DOCKER TEST
  # =========================
  docker-test:
    needs: test
    runs-on: ubuntu-latest

    steps:

      # Get source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Build only the test stage.
      - name: Build Docker test image
        run: |
          docker build \
            --target test \
            -t ci-demo:test \
            .

      # Run tests inside the Docker test image.
      - name: Run tests inside Docker
        run: |
          docker run --rm ci-demo:test


  # =========================
  # 3. BUILD PRODUCTION IMAGE
  # =========================
  build:
    needs:
      - test
      - docker-test

    runs-on: ubuntu-latest

    steps:

      # Get source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the production Docker image.
      # The Git commit SHA becomes the image tag.
      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            -t ci-demo:${{ github.sha }} \
            .

      # Test the actual production image.
      - name: Test production Docker image
        run: |
          docker run --rm ci-demo:${{ github.sha }}


  # =========================
  # 4. DEPLOY TO STAGING
  # =========================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    # This is a REAL GitHub Environment.
    environment:
      name: staging

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # Deployment is simulated for now.
      - name: Deploy to staging
        run: |
          echo "Deploying Docker application to STAGING..."
          echo "Image: ci-demo:${{ github.sha }}"


  # =========================
  # 5. DEPLOY TO PRODUCTION
  # =========================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    # This connects the job to the GitHub
    # Environment named "production".
    #
    # Configure Required Reviewers under:
    # Repository → Settings → Environments → production
    environment:
      name: production

    steps:

      # Deployment is simulated for now.
      - name: Deploy to production
        run: |
          echo "Deploying Docker application to PRODUCTION..."
          echo "Image: ci-demo:${{ github.sha }}"
