
name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # 1. CONTINUOUS INTEGRATION
  # =========================
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔄 CHANGED
      # Install application dependencies from requirements.txt
      # and CI-only tools.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      # Show environment variable
      - name: Show environment
        run: echo "Environment is $APP_ENV"

      # Run code quality checks
      - name: Lint Python code
        run: flake8 app.py test_app.py

      # Run automated tests
      - name: Run tests
        run: pytest


  # =========================
  # 2. BUILD APPLICATION
  # =========================
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp test_app.py build/

      # Store application artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-demo
          path: build/


  # ==================================================
  # 🆕 3. BUILD PRODUCTION DOCKER IMAGE + PUSH
  # ==================================================
  docker-build-push:

    # 🔄 CHANGED
    # Previously this depended on docker-test.
    # There is no docker-test stage anymore.
    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # 🆕 NEW
      # Authenticate with Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🆕 NEW
      # Build the production Docker image.
      #
      # Your Dockerfile contains:
      #
      # FROM python:3.12-slim AS production
      #
      # Therefore --target production is valid.
      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            -t hasintha64/ci-demo:${{ github.sha }} \
            .

      # 🆕 NEW
      # Push the immutable Git-SHA image to Docker Hub.
      - name: Push Docker image
        run: |
          docker push hasintha64/ci-demo:${{ github.sha }}


  # =========================
  # 4. DEPLOY TO STAGING
  # =========================
  deploy-staging:

    # 🔄 CHANGED
    # Staging now waits for the Docker image
    # to be successfully pushed.
    needs: docker-build-push

    runs-on: ubuntu-latest

    # Real GitHub Environment
    environment:
      name: staging

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-demo
          path: build/

      - name: Deploy to staging
        run: |
          echo "Deploying application to STAGING..."
          ls -la build/


  # =========================
  # 5. DEPLOY TO PRODUCTION
  # =========================
  deploy-production:

    needs: deploy-staging

    runs-on: ubuntu-latest

    # Real GitHub Environment
    environment:
      name: production

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-demo
          path: build/

      - name: Deploy to production
        run: |
          echo "Deploying application to PRODUCTION..."
          ls -la build/

