
name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # 1. CONTINUOUS INTEGRATION
  # =========================
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest flake8

      - name: Show environment
        run: echo "Environment is $APP_ENV"

      - name: Lint Python code
        run: flake8 app.py test_app.py

      - name: Run tests
        run: pytest


  # =========================
  # 2. DOCKER TEST
  # =========================
  docker-test:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: |
          docker build \
            --target test \
            -t ci-demo:test \
            .

      - name: Run tests inside Docker
        run: |
          docker run --rm ci-demo:test


  # ==================================================
  # 3. SERVER TEST — SELF-HOSTED RUNNER
  # ==================================================
  server-test:
    needs: docker-test
    runs-on: self-hosted

    steps:

      - name: Show server hostname
        run: hostname

      - name: Show current user
        run: whoami

      - name: Show Docker version
        run: docker --version

      - name: Check Docker access
        run: docker ps


  # ==================================================
  # 🆕 4. BUILD AND PUSH DOCKER IMAGE
  # ==================================================
  docker-push:
    needs: server-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # 🆕 Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🆕 Build production Docker image
      - name: Build production image
        run: |
          docker build \
            --target production \
            -t hasintha64/ci-demo:${{ github.sha }} \
            -t hasintha64/ci-demo:latest \
            .

      # 🆕 Push versioned image
      - name: Push versioned image
        run: |
          docker push hasintha64/ci-demo:${{ github.sha }}

      # 🆕 Push latest image
      - name: Push latest image
        run: |
          docker push hasintha64/ci-demo:latest


  # ==================================================
  # 🆕 5. REAL DEPLOYMENT TO STAGING SERVER
  # ==================================================
  deploy-staging:
    needs: docker-push
    runs-on: self-hosted

    environment:
      name: staging

    steps:

      # 🆕 Pull exact image produced by this pipeline
      - name: Pull Docker image
        run: |
          docker pull hasintha64/ci-demo:${{ github.sha }}

      # 🆕 Stop old container
      - name: Stop old container
        run: |
          docker stop ci-demo || true
          docker rm ci-demo || true

      # 🆕 Start new container
      - name: Start new container
        run: |
          docker run -d \
            --name ci-demo \
            --restart unless-stopped \
            hasintha64/ci-demo:${{ github.sha }}

      # 🆕 Verify deployment
      - name: Verify container
        run: |
          docker ps
          docker logs ci-demo


  # ==================================================
  # 6. DEPLOY TO PRODUCTION
  # ==================================================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Deploy to production
        run: |
          echo "Production deployment will be configured next."

