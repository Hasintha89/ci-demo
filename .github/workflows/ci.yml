name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # 1. CONTINUOUS INTEGRATION
  # =========================
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔄 CHANGED
      # Install application dependencies from requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Show environment
        run: echo "Environment is $APP_ENV"

      - name: Lint Python code
        run: flake8 app.py test_app.py

      - name: Run tests
        run: pytest

  # =========================
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp test_app.py build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-demo
          path: build/


  # ==================================================
  # 🆕 4. BUILD PRODUCTION DOCKER IMAGE + PUSH
  # ==================================================
  docker-build-push:
    needs: docker-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # 🆕 NEW
      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🆕 NEW
      # Build the production stage
      # The Git commit SHA becomes the image version.
      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            -t hasintha64/ci-demo:${{ github.sha }} \
            .

      # 🆕 NEW
      # Push immutable image to Docker Hub
      - name: Push Docker image
        run: |
          docker push hasintha64/ci-demo:${{ github.sha }}


  # =========================
  # 5. DEPLOY TO STAGING
  # =========================
  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-demo
          path: build/

      - name: Deploy to staging
        run: |
          echo "Deploying application to STAGING..."
          ls -la build/


  # =========================
  # 6. DEPLOY TO PRODUCTION
  # =========================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-demo
          path: build/

      - name: Deploy to production
        run: |
          echo "Deploying application to PRODUCTION..."
          ls -la build/

