name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # 1. CONTINUOUS INTEGRATION
  # =========================
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest flake8

      - name: Show environment
        run: echo "Environment is $APP_ENV"

      - name: Lint Python code
        run: flake8 app.py test_app.py

      - name: Run tests
        run: pytest


  # =========================
  # 2. DOCKER TEST
  # =========================
  docker-test:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: |
          docker build \
            --target test \
            -t ci-demo:test \
            .

      - name: Run tests inside Docker
        run: |
          docker run --rm ci-demo:test


  # =========================
  # 3. BUILD & PUSH PRODUCTION IMAGE
  # =========================
  # 🔵 NEW JOB
  # Replaces the old artifact-based build job.
  #
  # The Docker image is now our deployment artifact.
  #
  docker-build-push:
    needs:
      - test
      - docker-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # 🔵 NEW
      # Login securely using GitHub repository secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔵 NEW
      # Build the production stage only.
      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest \
            .

      # 🔵 NEW
      # Test the exact production image before pushing it.
      - name: Test production Docker image
        run: |
          docker run --rm \
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest

      # 🔵 NEW
      # Push the tested production image to Docker Hub.
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest


  # =========================
  # 4. DEPLOY TO STAGING
  # =========================
  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Deploy to staging
        run: |
          echo "Deploying Docker image to STAGING..."
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest"


  # =========================
  # 5. DEPLOY TO PRODUCTION
  # =========================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Deploy to production
        run: |
          echo "Deploying Docker image to PRODUCTION..."
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest"
