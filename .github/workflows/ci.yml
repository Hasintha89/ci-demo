
name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # 1. CONTINUOUS INTEGRATION
  # =========================
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest flake8

      - name: Show environment
        run: echo "Environment is $APP_ENV"

      - name: Lint Python code
        run: flake8 app.py test_app.py

      - name: Run tests
        run: pytest


  # =========================
  # 2. DOCKER TEST
  # =========================
  docker-test:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: |
          docker build \
            --target test \
            -t ci-demo:test \
            .

      - name: Run tests inside Docker
        run: |
          docker run --rm ci-demo:test


  # ==================================================
  # 🆕 3. SERVER TEST — SELF-HOSTED RUNNER
  # ==================================================
  server-test:
    needs: docker-test
    runs-on: self-hosted

    steps:

      - name: Show server hostname
        run: hostname

      - name: Show current user
        run: whoami

      - name: Show Docker version
        run: docker --version

      - name: Check Docker access
        run: docker ps


  # =========================
  # 4. BUILD
  # =========================
  build:
    needs: server-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp test_app.py build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-demo
          path: build/


  # =========================
  # 5. DEPLOY TO STAGING
  # =========================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-demo
          path: build/

      - name: Deploy to staging
        run: |
          echo "Deploying application to STAGING..."
          ls -la build/


  # =========================
  # 6. DEPLOY TO PRODUCTION
  # =========================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-demo
          path: build/

      - name: Deploy to production
        run: |
          echo "Deploying application to PRODUCTION..."
          ls -la build/
```
